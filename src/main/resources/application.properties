spring.application.name=reservas

# --- Banco ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/reservas}
spring.datasource.username=${DB_USERNAME:reservas}
spring.datasource.password=${DB_PASSWORD:reservas}

# --- JPA ---
# O schema e responsabilidade exclusiva do Flyway; o Hibernate apenas valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Nao definimos hibernate.jdbc.time_zone de proposito. Essa propriedade faz o
# Hibernate converter TODO valor temporal para o fuso indicado ao gravar —
# inclusive os LocalTime de horario de funcionamento, que sao hora de parede e
# nao um ponto na linha do tempo. Com ela, "fecha as 23h" virava 02h no banco e
# a check constraint de fechamento > abertura estourava.
#
# Ela nao faz falta: os instantes sao Instant gravados em TIMESTAMPTZ, e o driver
# ja registra o ponto correto na linha do tempo qualquer que seja o fuso da JVM.

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Aplicacao inteira em UTC, independente do fuso da maquina ---
spring.jackson.time-zone=UTC

# --- Problem Details (RFC 9457) nas respostas de erro ---
spring.mvc.problemdetails.enabled=true

# --- OpenAPI / Swagger UI ---
# Endpoints agrupados por tag e ordenados, em vez da ordem de descoberta do
# springdoc, que muda entre execucoes e deixa a pagina imprevisivel.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
# Nao expande os schemas por padrao: a pagina abre legivel em vez de um paredao.
springdoc.swagger-ui.default-models-expand-depth=0
springdoc.api-docs.path=/v3/api-docs

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# --- Regras de negocio configuraveis ---
reservas.fuso-horario=America/Sao_Paulo
reservas.duracao-minima-minutos=60
reservas.duracao-maxima-minutos=180
reservas.granularidade-minutos=30
reservas.antecedencia-minima-cancelamento-horas=6
reservas.antecedencia-maxima-dias=30

# --- Admin inicial (opcional) ---
# Sem estas variaveis definidas, nenhum admin e criado no boot. Nao ha valor
# padrao de proposito: sistema que sobe com credencial de administrador conhecida
# e como instalacao de exemplo acaba invadida.
reservas.admin-inicial.nome=${ADMIN_INICIAL_NOME:Administrador}
reservas.admin-inicial.email=${ADMIN_INICIAL_EMAIL:}
reservas.admin-inicial.senha=${ADMIN_INICIAL_SENHA:}

# --- JWT (segredo sempre por variavel de ambiente) ---
reservas.jwt.segredo=${JWT_SECRET:}
reservas.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:120}
reservas.jwt.emissor=reservas-api
