# ---------------------------------------------------------------------------
# Perfil "docker" -- ativado pela variavel SPRING_PROFILES_ACTIVE.
#
# O application.properties e o arquivo base: vale sempre. Um arquivo
# application-<perfil>.properties e lido DEPOIS dele e sobrescreve so as chaves
# que repetir. Tudo que nao aparecer aqui continua vindo do arquivo base.
# ---------------------------------------------------------------------------

# Log de aplicacao em INFO. O nivel DEBUG do desenvolvimento gera varias linhas
# por requisicao, o que e util para entender o fluxo e insuportavel num servico
# que recebe trafego.
logging.level.com.joaoalcantara.reservas=INFO
logging.level.org.hibernate.SQL=WARN

# O /actuator/health com detalhes revela o banco em uso, o espaco livre em disco
# e o estado do pool de conexoes. E informacao util para quem administra o
# servico e para quem quer ataca-lo. Sem autenticacao no endpoint, ele e
# publico -- entao detalhe nenhum.
#
# O health check do Render nao perde nada com isso: ele so olha o "status".
management.endpoint.health.show-details=never
